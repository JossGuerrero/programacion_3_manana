<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Contacto - Transporte Quito</title>
</head>
<body>
    <p><b>Formulario de Contacto del Servicio de Transporte</b></p>
    
    <form action="enviar_consulta_transporte" method="post">
        
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre_completo">
        
        <label for="correo">Correo Electrónico (Para respuesta):</label>
        <input type="email" id="correo" name="correo_contacto">
        
        <input type="submit" value="Enviar Consulta">
        
    </form>

</body>
</html>
