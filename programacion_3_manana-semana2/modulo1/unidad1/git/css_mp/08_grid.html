<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout - SITM-Q Validadores</title>
    
    <style>
        .grid {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px;
            gap: 10px;
            background-color: #2196f3;
            padding: 10px;
            width: 340px;
            margin: 20px auto;
        }

        .item {
            background-color: #388e3c;
            color: white;
            padding: 20px;
            border: 2px solid #F57C00;
            text-align: center;
            border: 20px solid white;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.5);
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="08_grid.css">
</head>
<body>
    
    <h1>Grid: Matriz de Validadores de Tarjeta </h1>
    <p style="text-align: center;">El Grid organiza </p>
    
    <div class="grid">
        <div class="item">ENTRADA N1</div>
        <div class="item">ENTRADA N2</div>
        <div class="item">SALIDA S1</div>
        <div class="item">SALIDA S2</div>
    </div>

</body>
</html>
