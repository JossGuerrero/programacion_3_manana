<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón Animado - Metro de Quito</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        
        h1 {
            color: #031f99;
        }

        .boton {
            background-color: #03a9f4; 
            border: none;
            color: white;
            padding: 16px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 4px 2px;
            border-radius: 8px;
            transition-duration: 0.4s;
            cursor: pointer;
            font-weight: bold;
        }

        .boton:hover {
            background-color: white;
            color: #03a9f4;
            border: 2px solid #03a9f4;
            transform: scale(1.1);
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        }
    </style>
    <link rel="stylesheet" href="10_animaciones.css">
</head>
<body>
    
    <h1>Adquiere tu Tarjeta SITM-Q</h1>
    <button class="boton">COMPRAR TARJETA METRO</button>

</body>
</html>
