<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout - SITM-Q Portal</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: 
                "header header"
                "aside main"
                "footer footer";
            min-height: 100vh;
        }
        
        header {
            grid-area: header;
            background-color: #031f99;
            color: white;
            padding: 10px;
        }
        aside {
            grid-area: aside;
            background-color: #f0f0f0;
            padding: 10px;
        }
        main {
            grid-area: main;
            background-color: white;
            padding: 10px;
        }
        footer {
            grid-area: footer;
            background-color: #444;
            color: white;
            padding: 10px;
        }
        
        .layout > * {
            border: 2px solid black;
            text-align: center;
            font-size: 1em;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            padding: 20px;
        }
    </style>
    <link rel="stylesheet" href="09_grid_layout.css">
</head>
<body>
    
    <h1>Grid Layout: Estructura Principal del Portal de Transporte</h1>
    
    <div class="layout">
        <header>
            <h2>SITM-Q | ENCABEZADO</h2>
            <p style="font-size: 0.8em; margin: 0;">Portal de Movilidad de Quito</p>
        </header>
        
        <aside>
            <p>MENÚ LATERAL</p>
            <nav style="font-size: 0.8em;">
                <ul>
                    <li>Rutas Metro</li>
                    <li>Noticias Trolebús</li>
                    <li>Contacto</li>
                </ul>
            </nav>
        </aside>
        
        <main>
            <p>CONTENIDO PRINCIPAL</p>
            <h3>Detalles y Mapas del Servicio</h3>
            
        
        <footer>
            <p>INFORMACIÓN LEGAL Y CONTACTO</p>
            <p style="font-size: 0.8em; margin: 0;">&copy; 2025 EPMTPQ</p>
        </footer>

    </div>

</body>
</html>
