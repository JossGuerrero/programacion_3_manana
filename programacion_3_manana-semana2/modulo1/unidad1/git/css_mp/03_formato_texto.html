<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato de Texto - SITM-Q</title>
    
    <style>
       
        .texto_primario {
            color: #000000;
            background-color: green;
            font-size: 18px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            line-height: 1.7;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-spacing: 5px; /
            white-space: nowrap; 
            padding: 5px;
            display: block;
        }
        .texto_secundario {
            color: #d91cc3d1; 
            background-color: yellow;
            font-size: 14px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: normal;
            line-height: 1;
            text-decoration: line-through; 
            text-transform: lowercase;
            letter-spacing: 1px;
            word-spacing: 1px;
            white-space: nowrap; 
            padding: 5px;
            display: block;
        }
        body {
            padding: 20px;
        }
    </style>
    <link rel="stylesheet" href="03_formato_texto.css">
</head>
<body>
    
    <h1>Sistema de Transporte de Quito (SITM-Q)</h1>
    
    <p class="texto_primario">
        tarifa oficial del metro: usd $0.45.
    </p>

    <p class="texto_secundario">
        la tarifa antigua era de $0.25 para el trolebus.
    </p>

  
    
</body>
</html>
